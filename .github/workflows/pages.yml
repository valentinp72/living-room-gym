# Tests the app and publishes it on GitHub Pages.
# - Pull requests: build and test only.
# - Pushes to main (and manual runs): build, test, then deploy.
# The deployed copy is www/ with cache busting (see scripts/cache-bust.mjs);
# the tests run against that exact copy.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; don't cancel one that has started.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Build the site (www/ + cache busting)
        run: |
          cp -r www _site
          node .github/scripts/cache-bust.mjs _site "${GITHUB_SHA::7}"

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Test the site
        working-directory: tests
        env:
          WWW: ${{ github.workspace }}/_site
          CHROME: /usr/bin/google-chrome
        run: npm test

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
