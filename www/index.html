<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XR Muscle Gym</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<a-scene background="color:#0d1117">
  <a-assets></a-assets>

  <a-entity id="rig" position="0 0 0">
    <a-entity id="camera" camera="active:true" position="0 1.6 0" look-controls wasd-controls>
      <a-entity cursor="fuse:false" raycaster="objects:.clickable; far:20"
        geometry="primitive:ring; radiusInner:0.005; radiusOuter:0.009" position="0 0 -1"
        material="color:#fff; shader:flat"></a-entity>
    </a-entity>
    <a-entity id="rightHand" laser-controls="hand:right" raycaster="objects:.clickable; far:20"></a-entity>
    <a-entity id="leftHand" laser-controls="hand:left" raycaster="objects:.clickable; far:20"></a-entity>
  </a-entity>

  <a-plane rotation="-90 0 0" width="20" height="20" color="#1b1f24"></a-plane>
  <a-entity light="type:ambient; intensity:0.7; color:#fff"></a-entity>
  <a-entity light="type:directional; intensity:0.6" position="1 3 1"></a-entity>

  <a-entity id="menuPanel" gym-app position="0 1.6 -2">
    <a-plane width="2.4" height="2" color="#000" opacity="0.65"></a-plane>
    <a-text value="XR MUSCLE GYM" align="center" position="0 0.75 0.01" width="3.2" color="#fff"></a-text>
    <a-text value="Pick an exercise" align="center" position="0 0.55 0.01" width="2" color="#999"></a-text>
    <a-entity id="menuButtons"></a-entity>
  </a-entity>

  <a-entity id="exercisePanel" position="-0.55 1.6 -2.1" rotation="0 15 0" visible="false">
    <a-plane width="2.4" height="2.1" color="#000" opacity="0.65"></a-plane>
    <a-text id="exerciseTitle" value="" align="center" position="0 0.85 0.01" width="3.2" color="#fff"></a-text>
    <a-text id="instrText" value="" align="center" position="0 0.5 0.01" width="2.6" color="#bbb"></a-text>
    <a-text id="repText" value="" align="center" position="0 0.05 0.01" width="3.8" color="#ffeb3b"></a-text>
    <a-entity id="btnToggle" class="clickable" visible="false"
      geometry="primitive:plane; width:1.4; height:0.3" material="color:#ad1457" position="0 -0.4 0.01">
      <a-text value="Start / Stop" align="center" position="0 0 0.01" color="#fff" width="3.2"></a-text>
    </a-entity>
    <a-entity id="btnBack" class="clickable" geometry="primitive:plane; width:1.4; height:0.3"
      material="color:#555" position="0 -0.8 0.01">
      <a-text value="Back to Menu" align="center" position="0 0 0.01" color="#fff" width="3.2"></a-text>
    </a-entity>
  </a-entity>
</a-scene>
<div id="hint">Open on the Meta Quest Browser and tap "Enter VR". On desktop, look with the mouse and click the panels to test.</div>
</body>
</html>
