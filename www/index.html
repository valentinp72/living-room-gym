<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XR Muscle Gym</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- AR (passthrough) is the main mode; VR is kept as a fallback. -->
<a-scene xr-environment="color:#0d1117" xr-mode-ui="XRMode: xr"
  webxr="optionalFeatures: bounded-floor, hand-tracking">
  <a-assets></a-assets>

  <a-entity id="rig" position="0 0 0">
    <a-entity id="camera" camera="active:true" position="0 1.6 0" look-controls wasd-controls>
      <a-entity class="flat-only" cursor="fuse:false" raycaster="objects:.clickable; far:20"
        geometry="primitive:ring; radiusInner:0.005; radiusOuter:0.009" position="0 0 -1"
        material="color:#fff; shader:flat"></a-entity>
    </a-entity>
    <a-entity id="rightHand" laser-controls="hand:right" raycaster="objects:.clickable; far:20"></a-entity>
    <a-entity id="leftHand" laser-controls="hand:left" raycaster="objects:.clickable; far:20"></a-entity>
    <!-- Bare hands: pinch to click. In AR the real hands show through
         passthrough; in VR a hand model is drawn. -->
    <a-entity id="rightHandPointer" hand-pointer="hand: right"></a-entity>
    <a-entity id="leftHandPointer" hand-pointer="hand: left"></a-entity>
    <a-entity class="vr-only" hand-tracking-controls="hand: right"></a-entity>
    <a-entity class="vr-only" hand-tracking-controls="hand: left"></a-entity>
    <!-- Counter shown on the floor in front of the face during floor
         exercises (plank), where the panels are out of sight. -->
    <a-entity id="floorLabel" visible="false">
      <a-plane width="0.7" height="0.24" color="#000" opacity="0.6"></a-plane>
      <a-text id="floorLabelText" value="" align="center" position="0 0 0.005" width="1.1" color="#ffeb3b"></a-text>
    </a-entity>
  </a-entity>

  <a-plane class="vr-only" rotation="-90 0 0" width="20" height="20" color="#1b1f24"></a-plane>
  <a-entity light="type:ambient; intensity:0.7; color:#fff"></a-entity>
  <a-entity light="type:directional; intensity:0.6" position="1 3 1"></a-entity>

  <!-- Everything the user interacts with, placed relative to the user.
       Recentering moves and turns this entity (see recenter() in app.js). -->
  <a-entity id="stage" gym-app>
    <a-entity id="menuPanel" position="0 1.6 -2">
      <a-plane width="2.4" height="2" color="#000" opacity="0.65"></a-plane>
      <a-text value="XR MUSCLE GYM" align="center" position="0 0.75 0.01" width="3.2" color="#fff"></a-text>
      <a-text value="Pick an exercise" align="center" position="0 0.55 0.01" width="2" color="#999"></a-text>
      <a-entity id="menuButtons"></a-entity>
      <a-entity id="btnRecenterMenu" class="button recenter" geometry="primitive:plane; width:1.2; height:0.2"
        material="color:#37474f" position="0 -0.85 0.01">
        <a-text value="Recenter (B / Y)" align="center" position="0 0 0.01" color="#fff" width="2.2"></a-text>
      </a-entity>
    </a-entity>

    <a-entity id="exercisePanel" position="-0.55 1.6 -2.1" rotation="0 15 0" visible="false">
      <a-plane width="2.4" height="2.1" color="#000" opacity="0.65"></a-plane>
      <a-text id="exerciseTitle" value="" align="center" position="0 0.85 0.01" width="3.2" color="#fff"></a-text>
      <a-text id="instrText" value="" align="center" position="0 0.5 0.01" width="2.6" color="#bbb"></a-text>
      <a-text id="repText" value="" align="center" position="0 0.05 0.01" width="3.8" color="#ffeb3b"></a-text>
      <a-entity id="btnBack" class="button" geometry="primitive:plane; width:0.95; height:0.3"
        material="color:#555" position="-0.5 -0.8 0.01">
        <a-text value="Back to Menu" align="center" position="0 0 0.01" color="#fff" width="2.4"></a-text>
      </a-entity>
      <a-entity id="btnRecenter" class="button recenter" geometry="primitive:plane; width:0.95; height:0.3"
        material="color:#37474f" position="0.5 -0.8 0.01">
        <a-text value="Recenter (B / Y)" align="center" position="0 0 0.01" color="#fff" width="2.4"></a-text>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>
<div id="hint">On Meta Quest, open this page in the Browser and tap "AR" to train in your room (passthrough), or "VR" for a virtual gym. On desktop, look with the mouse and click the panels to test.</div>
</body>
</html>
