<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XR Muscle Gym</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<style>
  html,body{ margin:0; height:100%; background:#0a0a0a; }
  #hint{ position:fixed; left:0; right:0; bottom:8px; text-align:center; color:#888;
    font:12px/1.4 system-ui,sans-serif; z-index:2; pointer-events:none; }
</style>
<script>
/* ---------------------------------------------------------------------
 * EXERCISE REGISTRY
 * To add a new exercise, push one object into EXERCISES with:
 *   id, name, muscle, color, instructions
 *   state()             -> fresh per-session state object
 *   update(ctx, st, dt) -> read ctx.camera/ctx.rHand/ctx.lHand each frame,
 *                          mutate st (reps, time, etc.)
 *   label(st)           -> string shown as the live counter
 *   demo(parts, t)       -> pose the mannequin each frame (t = seconds
 *                          since the exercise screen opened) to show the move
 *   manual (optional)    -> true if it needs a Start/Stop button instead
 *                          of automatic rep detection (e.g. timed holds)
 * Nothing else in the app needs to change.
 * ------------------------------------------------------------------- */
const EXERCISES = [
  {
    id: 'squats', name: 'Squats', muscle: 'Legs', color: '#2e7d32',
    instructions: 'Stand still to calibrate, then squat down and stand back up for each rep.',
    state: () => ({ baselineY: null, down: false, reps: 0 }),
    update(ctx, st) {
      if (!ctx.camera.object3D) return;
      const y = ctx.camera.object3D.position.y;
      if (st.baselineY === null) { st.baselineY = y; return; }
      if (!st.down && y < st.baselineY - 0.25) st.down = true;
      else if (st.down && y > st.baselineY - 0.08) { st.down = false; st.reps++; }
    },
    label: st => 'Reps: ' + st.reps,
    demo(parts, t) {
      const c = (Math.sin(t * 1.3) + 1) / 2;
      parts.root.setAttribute('position', { x: 1.6, y: 1.1 - c * 0.3, z: -2 });
      parts.hipL.setAttribute('rotation', { x: c * 40, y: 0, z: 0 });
      parts.hipR.setAttribute('rotation', { x: c * 40, y: 0, z: 0 });
    }
  },
  {
    id: 'curls', name: 'Bicep Curls', muscle: 'Arms', color: '#1565c0',
    instructions: 'Hold a controller in each hand. Curl your hand up toward your shoulder, then lower it.',
    state: () => ({ leftUp: false, rightUp: false, reps: 0 }),
    update(ctx, st) {
      [['rHand', 'rightUp'], ['lHand', 'leftUp']].forEach(([handKey, flagKey]) => {
        const hand = ctx[handKey];
        if (!hand || !hand.object3D || !ctx.camera.object3D) return;
        const rel = hand.object3D.position.y - ctx.camera.object3D.position.y;
        if (!st[flagKey] && rel > -0.15) st[flagKey] = true;
        else if (st[flagKey] && rel < -0.45) { st[flagKey] = false; st.reps++; }
      });
    },
    label: st => 'Reps: ' + st.reps,
    demo(parts, t) {
      const ang = -((Math.sin(t * 2) + 1) / 2) * 110;
      parts.shoulderL.setAttribute('rotation', { x: ang, y: 0, z: 0 });
      parts.shoulderR.setAttribute('rotation', { x: ang, y: 0, z: 0 });
    }
  },
  {
    id: 'plank', name: 'Plank Hold', muscle: 'Abs', color: '#ef6c00',
    instructions: 'Get into plank position, then press Start/Stop below to time your hold.',
    manual: true,
    state: () => ({ running: false, time: 0 }),
    update(ctx, st, dt) { if (st.running) st.time += dt / 1000; },
    label: st => 'Hold: ' + st.time.toFixed(1) + 's',
    demo(parts) {
      parts.root.setAttribute('position', { x: 1.6, y: 0.55, z: -2 });
      parts.root.setAttribute('rotation', { x: -90, y: 0, z: 0 });
    }
  }
];

function buildMannequin(sceneEl) {
  const root = document.createElement('a-entity');
  root.setAttribute('id', 'mannequin');
  root.setAttribute('position', '1.6 1.1 -2');
  root.setAttribute('visible', false);

  function part(tag, attrs, parent) {
    const e = document.createElement(tag);
    Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    (parent || root).appendChild(e);
    return e;
  }
  part('a-box', { color: '#e0e0e0', width: 0.3, height: 0.5, depth: 0.18, position: '0 0 0' });
  part('a-sphere', { color: '#e0e0e0', radius: 0.13, position: '0 0.38 0' });
  const shoulderL = part('a-entity', { position: '-0.22 0.2 0' });
  part('a-box', { color: '#c0c0c0', width: 0.09, height: 0.4, depth: 0.09, position: '0 -0.2 0' }, shoulderL);
  const shoulderR = part('a-entity', { position: '0.22 0.2 0' });
  part('a-box', { color: '#c0c0c0', width: 0.09, height: 0.4, depth: 0.09, position: '0 -0.2 0' }, shoulderR);
  const hipL = part('a-entity', { position: '-0.1 -0.25 0' });
  part('a-box', { color: '#9e9e9e', width: 0.11, height: 0.45, depth: 0.11, position: '0 -0.22 0' }, hipL);
  const hipR = part('a-entity', { position: '0.1 -0.25 0' });
  part('a-box', { color: '#9e9e9e', width: 0.11, height: 0.45, depth: 0.11, position: '0 -0.22 0' }, hipR);

  sceneEl.appendChild(root);
  return { root, shoulderL, shoulderR, hipL, hipR };
}

AFRAME.registerComponent('gym-app', {
  init: function () {
    this.camera = document.querySelector('#camera');
    this.rHand = document.querySelector('#rightHand');
    this.lHand = document.querySelector('#leftHand');
    this.menuPanel = document.querySelector('#menuPanel');
    this.exercisePanel = document.querySelector('#exercisePanel');
    this.titleText = document.querySelector('#exerciseTitle');
    this.instrText = document.querySelector('#instrText');
    this.repText = document.querySelector('#repText');
    this.toggleBtn = document.querySelector('#btnToggle');
    this.mannequin = buildMannequin(this.el.sceneEl);
    this.current = null;
    this.clock = 0;

    const menuButtons = document.querySelector('#menuButtons');
    EXERCISES.forEach((ex, i) => {
      const btn = document.createElement('a-entity');
      btn.setAttribute('class', 'clickable');
      btn.setAttribute('geometry', 'primitive: plane; width: 1.8; height: 0.3');
      btn.setAttribute('material', 'color:' + ex.color);
      btn.setAttribute('position', '0 ' + (0.25 - i * 0.4) + ' 0.01');
      const label = document.createElement('a-text');
      label.setAttribute('value', ex.name + ' — ' + ex.muscle);
      label.setAttribute('align', 'center');
      label.setAttribute('color', '#fff');
      label.setAttribute('width', '3.2');
      label.setAttribute('position', '0 0 0.01');
      btn.appendChild(label);
      btn.addEventListener('click', () => this.startExercise(ex));
      menuButtons.appendChild(btn);
    });

    document.querySelector('#btnBack').addEventListener('click', () => this.showMenu());
    this.toggleBtn.addEventListener('click', () => {
      if (this.current && this.current.ex.manual) this.current.st.running = !this.current.st.running;
    });
  },
  showMenu: function () {
    this.current = null;
    this.menuPanel.setAttribute('visible', true);
    this.exercisePanel.setAttribute('visible', false);
    this.mannequin.root.setAttribute('visible', false);
  },
  startExercise: function (ex) {
    this.current = { ex, st: ex.state() };
    this.clock = 0;
    this.menuPanel.setAttribute('visible', false);
    this.exercisePanel.setAttribute('visible', true);
    this.titleText.setAttribute('value', ex.name.toUpperCase() + ' — ' + ex.muscle);
    this.instrText.setAttribute('value', ex.instructions);
    this.toggleBtn.setAttribute('visible', !!ex.manual);
    this.mannequin.root.setAttribute('visible', true);
    this.repText.setAttribute('value', ex.label(this.current.st));
  },
  tick: function (t, delta) {
    if (!this.current) return;
    this.clock += delta / 1000;
    const ctx = { camera: this.camera, rHand: this.rHand, lHand: this.lHand };
    this.current.ex.update(ctx, this.current.st, delta);
    this.repText.setAttribute('value', this.current.ex.label(this.current.st));
    this.current.ex.demo(this.mannequin, this.clock);
  }
});
</script>
</head>
<body>
<a-scene background="color:#0d1117">
  <a-assets></a-assets>

  <a-entity id="rig" position="0 0 0">
    <a-entity id="camera" camera="active:true" position="0 1.6 0" look-controls wasd-controls>
      <a-entity cursor="fuse:false" raycaster="objects:.clickable; far:20"
        geometry="primitive:ring; radiusInner:0.005; radiusOuter:0.009" position="0 0 -1"
        material="color:#fff; shader:flat"></a-entity>
    </a-entity>
    <a-entity id="rightHand" laser-controls="hand:right" raycaster="objects:.clickable; far:20"></a-entity>
    <a-entity id="leftHand" laser-controls="hand:left" raycaster="objects:.clickable; far:20"></a-entity>
  </a-entity>

  <a-plane rotation="-90 0 0" width="20" height="20" color="#1b1f24"></a-plane>
  <a-entity light="type:ambient; intensity:0.7; color:#fff"></a-entity>
  <a-entity light="type:directional; intensity:0.6" position="1 3 1"></a-entity>

  <a-entity id="menuPanel" gym-app position="0 1.6 -2">
    <a-plane width="2.4" height="2" color="#000" opacity="0.65"></a-plane>
    <a-text value="XR MUSCLE GYM" align="center" position="0 0.75 0.01" width="3.2" color="#fff"></a-text>
    <a-text value="Pick an exercise" align="center" position="0 0.55 0.01" width="2" color="#999"></a-text>
    <a-entity id="menuButtons"></a-entity>
  </a-entity>

  <a-entity id="exercisePanel" position="0 1.6 -2" visible="false">
    <a-plane width="2.4" height="2.1" color="#000" opacity="0.65"></a-plane>
    <a-text id="exerciseTitle" value="" align="center" position="0 0.85 0.01" width="3.2" color="#fff"></a-text>
    <a-text id="instrText" value="" align="center" position="0 0.5 0.01" width="2.6" color="#bbb"></a-text>
    <a-text id="repText" value="" align="center" position="0 0.05 0.01" width="3.8" color="#ffeb3b"></a-text>
    <a-entity id="btnToggle" class="clickable" visible="false"
      geometry="primitive:plane; width:1.4; height:0.3" material="color:#ad1457" position="0 -0.4 0.01">
      <a-text value="Start / Stop" align="center" position="0 0 0.01" color="#fff" width="3.2"></a-text>
    </a-entity>
    <a-entity id="btnBack" class="clickable" geometry="primitive:plane; width:1.4; height:0.3"
      material="color:#555" position="0 -0.8 0.01">
      <a-text value="Back to Menu" align="center" position="0 0 0.01" color="#fff" width="3.2"></a-text>
    </a-entity>
  </a-entity>
</a-scene>
<div id="hint">Open on the Meta Quest Browser and tap "Enter VR". On desktop, look with the mouse and click the panels to test.</div>
</body>
</html>
