<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living Room Gym</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- AR (passthrough) only: training blind in VR, without seeing the real
     room, could hurt. VR sessions are refused (see xr-environment.js).
     The flat page stays, for debugging on a desktop. -->
<a-scene xr-environment="color:#0d1117" xr-mode-ui="XRMode: ar"
  webxr="optionalFeatures: hand-tracking"
  cursor="rayOrigin: mouse" raycaster="objects: .clickable">
  <a-assets></a-assets>

  <a-entity id="rig" position="0 0 0">
    <!-- Desktop: the mouse clicks (cursor on <a-scene>, rayOrigin: mouse). -->
    <a-entity id="camera" camera="active:true" position="0 1.6 0" look-controls wasd-controls></a-entity>
    <!-- Pointing + clicking in XR, controllers (trigger) and bare hands (pinch). -->
    <a-entity id="rightPointer" xr-pointer="hand: right"></a-entity>
    <a-entity id="leftPointer" xr-pointer="hand: left"></a-entity>
    <!-- A/B/X/Y button events. Their controller models stay hidden: in AR
         the real controllers show through passthrough. No laser cursors. -->
    <a-entity id="rightHand" class="flat-only" oculus-touch-controls="hand: right"></a-entity>
    <a-entity id="leftHand" class="flat-only" oculus-touch-controls="hand: left"></a-entity>
    <!-- Counter near the face when the panels are out of sight or too close
         (on the floor during a plank, floating in front of the face
         otherwise; see updateFloorLabel() in app.js), with a small demo
         avatar (#floorAvatar) on its right. -->
    <a-entity id="floorLabel" visible="false">
      <a-plane id="floorLabelBg" width="1.0" height="0.45" color="#000" opacity="0.8"></a-plane>
      <a-text id="floorLabelText" value="" align="center" position="-0.22 0 0.005" width="0.55"
        wrap-count="18" color="#ffeb3b"></a-text>
      <a-entity id="floorAvatar" position="0.27 -0.2 0.03" scale="0.2 0.2 0.2"></a-entity>
    </a-entity>
  </a-entity>

  <!-- Virtual floor for the desktop page; in AR the real floor shows. -->
  <a-plane class="flat-only" rotation="-90 0 0" width="20" height="20" color="#1b1f24"></a-plane>
  <a-entity light="type:ambient; intensity:0.7; color:#fff"></a-entity>
  <a-entity light="type:directional; intensity:0.6" position="1 3 1"></a-entity>

  <!-- Confetti when a training set step is done (see confetti.js). In world
     space, not in #stage: bursts are placed from the head pose. -->
  <a-entity id="confetti" confetti></a-entity>

  <!-- Everything the user interacts with, placed relative to the user.
       Recentering moves and turns this entity (see recenter() in app.js). -->
  <a-entity id="stage" gym-app>
    <!-- Safety notice, shown instead of the menu until accepted once on this
         device (see showMenu() in app.js). -->
    <a-entity id="safetyPanel" position="0 1.45 -2" visible="false">
      <a-plane id="safetyBg" width="2.6" height="1.9" color="#1a1206" opacity="0.92"></a-plane>
      <a-text value="BEFORE YOU START" align="center" position="0 0.75 0.01" width="3.2" color="#ffcc80"></a-text>
      <a-text id="safetyText" align="left" anchor="left" baseline="top" position="-1.15 0.55 0.01" width="2.3" wrap-count="46" color="#eee"
        value="You train at your own risk.&#10;&#10;- Clear the space around you: no furniture, walls, stairs, pets or people within reach, and keep seeing your room.&#10;- Stop at once if you feel pain, dizziness or discomfort.&#10;- If you have a health condition, an injury or are pregnant, ask a doctor first.&#10;- Rep counts and demos are guides, not medical or coaching advice.&#10;&#10;The authors accept no responsibility for any injury or damage."></a-text>
      <a-entity id="btnSafetyOk" class="button" geometry="primitive:plane; width:0.9; height:0.26"
        material="color:#2e7d32" position="0 -0.73 0.01">
        <a-text value="I understand" align="center" position="0 0 0.01" color="#fff" width="2.4"></a-text>
      </a-entity>
    </a-entity>

    <!-- Menu: buttons, layout and height are set by buildMenu() in app.js. -->
    <a-entity id="menuPanel" position="0 1.6 -2">
      <a-plane id="menuBg" width="2.6" height="2" color="#000" opacity="0.88"></a-plane>
      <a-text value="LIVING ROOM GYM" align="center" position="0 0.75 0.01" width="3.2" color="#fff"></a-text>
      <a-entity id="workoutButtons"></a-entity>
      <a-entity id="menuButtons"></a-entity>
      <a-entity id="btnRecenterMenu" class="button recenter" geometry="primitive:plane; width:0.5; height:0.24"
        material="color:#546e7a">
        <a-text value="Recenter" align="center" position="0 0 0.01" color="#fff" width="2.0"></a-text>
      </a-entity>
    </a-entity>

    <!-- Exercise screen, straight ahead: texts in a column on the left, the
         demo avatar in a frame on the right (#demoAvatar holds a half-size
         mannequin, built by buildMannequin() in avatar.js). -->
    <a-entity id="exercisePanel" position="0 1.5 -2.1" visible="false">
      <a-plane id="exerciseBg" width="2.9" height="2.3" color="#000" opacity="0.88"></a-plane>
      <a-text id="exerciseTitle" value="" align="center" position="0 0.98 0.01" width="3.2" color="#fff"></a-text>
      <a-text id="instrText" value="" align="left" anchor="left" baseline="top" position="-1.37 0.8 0.01"
        width="1.45" wrap-count="26" color="#bbb"></a-text>
      <!-- Anchored at its top: counters with extra lines grow down, away from the instructions. -->
      <a-text id="repText" value="" align="center" baseline="top" position="-0.66 0.05 0.01"
        width="1.45" wrap-count="19" color="#ffeb3b"></a-text>
      <a-plane id="demoFrame" width="1.24" height="1.46" position="0.78 0.13 0.005" color="#fff" opacity="0.07"></a-plane>
      <a-entity id="demoAvatar" position="0.66 -0.36 0.3" scale="0.45 0.45 0.45"></a-entity>
      <!-- During a rest: what comes next, in a card under the countdown, with
           a smaller mannequin (#nextAvatar) doing the next exercise's demo,
           while the big one rests (see showNext() in app.js). -->
      <a-entity id="nextCard" position="-0.66 -0.22 0" visible="false">
        <a-plane id="nextFrame" width="1.28" height="1.0" position="0 0 0.005" color="#fff" opacity="0.07"></a-plane>
        <a-text id="nextTitle" value="UP NEXT" align="center" position="0 0.43 0.01" width="1.3" color="#80deea"></a-text>
        <a-entity id="nextAvatar" position="0 -0.31 0.24" scale="0.32 0.32 0.32"></a-entity>
      </a-entity>
      <a-entity id="btnBack" class="button" geometry="primitive:plane; width:0.68; height:0.3"
        material="color:#555" position="-0.9 -0.9 0.01">
        <a-text value="Menu" align="center" position="0 0 0.01" color="#fff" width="2.4"></a-text>
      </a-entity>
      <a-entity id="btnSkip" class="button" geometry="primitive:plane; width:0.68; height:0.3"
        material="color:#6a1b9a" position="0 -0.9 0.01" visible="false">
        <a-text value="Skip" align="center" position="0 0 0.01" color="#fff" width="2.4"></a-text>
      </a-entity>
      <a-entity id="btnRecenter" class="button recenter" geometry="primitive:plane; width:0.68; height:0.3"
        material="color:#37474f" position="0.9 -0.9 0.01">
        <a-text value="Recenter (B / Y)" align="center" position="0 0 0.01" color="#fff" width="2.0"></a-text>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>
<div id="hint">On Meta Quest, open this page in the Browser and tap "AR" to train in your room (passthrough). There is no VR mode: you need to see your surroundings while you train. Clear the space around you and train at your own risk. On desktop, look with the mouse and click the panels to test.</div>
</body>
</html>
